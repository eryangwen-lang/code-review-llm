[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-llm"
version = "0.1.0"
description = "A Qwen-based LLM for Python code review and automated bug fixing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["code_review_llm*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
